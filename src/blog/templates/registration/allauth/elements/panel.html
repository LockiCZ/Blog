{% load allauth %}
<div class="container mb-4 light-bg p-3">
    <div class="row text-center">
        <h4 class="col-12">
            {% slot title %}
            {% endslot %}
        </h4>
    </div>
    <div class="row">
        {% slot body %}
        {% endslot %}
    </div>
    {% if slots.actions %}
        <div class="row p-3">
            {% slot actions %}
            {% endslot %}
        </div>
    {% endif %}
</div>
